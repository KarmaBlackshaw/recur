appId: com.erniejeash.recur
name: Settings — notifications off/on and reminder time change without errors
---
- runFlow: subflows/launch-fresh.yaml
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Reminder time, .*"
    direction: DOWN
- copyTextFrom:
    text: "\\d{1,2}:\\d{2} (AM|PM)"
    rightOf:
      text: "Reminder time"
      index: 0
- evalScript: ${output.initialTime = maestro.copiedText}
- assertTrue: ${output.initialTime.indexOf(':') > 0}

# Notifications off → on, quickly. Maestro's `checked` filter doesn't distinguish the Switch's state, so the
# state is captured as screenshots. Turning it on asks for permission when it was never asked.
- tapOn:
    rightOf:
      text: "Notifications"
      index: 1
- takeScreenshot: 09-notifications-off
- tapOn:
    rightOf:
      text: "Notifications"
      index: 1
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- takeScreenshot: 09-notifications-on
- assertNotVisible: "Notifications disabled.*"

# Change reminder time
- tapOn: "Reminder time, .*"
- extendedWaitUntil:
    visible: "Done"
    timeout: 5000
- swipe:
    from: "Hour,.*"
    direction: UP
- waitForAnimationToEnd
- tapOn: "Done"
- waitForAnimationToEnd
- assertNotVisible: ${output.initialTime}
- assertVisible:
    text: "\\d{1,2}:\\d{2} (AM|PM)"
    rightOf:
      text: "Reminder time"
      index: 0

# No error alert, app still alive
- assertNotVisible: ".*[Ff]ailed.*"
- assertNotVisible: ".*[Ee]rror.*"
- assertVisible: "Reminder time, .*"
