appId: com.erniejeash.recur
name: Add Expense — double-tap Save creates exactly one expense
---
- runFlow: subflows/launch-fresh.yaml
- runFlow: subflows/tab-accounts.yaml
- tapOn: "Add expense"
- extendedWaitUntil:
    visible: "Save expense"
    timeout: 5000
- tapOn: "Amount.*"
- inputText: "100"
- hideKeyboard
- tapOn:
    text: "Name"
    index: 1
- inputText: "Groceries"
- hideKeyboard
- doubleTapOn: "Save expense"
- extendedWaitUntil:
    visible: "NET WORTH"
    timeout: 10000
- waitForAnimationToEnd
# One debit only
- assertVisible: "Cash, cash, balance −₱100.00.*"
- runFlow: subflows/tab-activity.yaml
- assertVisible: "Groceries, Other, from Cash, ₱100.00.*"
