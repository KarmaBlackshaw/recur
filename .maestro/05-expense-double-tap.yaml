appId: com.erniejeash.recur
name: Add Expense — double-tap Save creates exactly one expense
---
- runFlow: subflows/launch-fresh.yaml
# Cash starts at ₱0 and can't overdraw
- runFlow:
    file: subflows/add-income.yaml
    env: { AMOUNT: "500", NOTE: "Allowance", ACCOUNT: "Cash" }
- runFlow: subflows/tab-home.yaml
- tapOn: "Add expense"
- extendedWaitUntil:
    visible: "Save expense"
    timeout: 5000
- tapOn: "Amount.*"
- inputText: "100"
- hideKeyboard
- tapOn:
    text: "Name"
    index: 1
- inputText: "Groceries"
- hideKeyboard
- doubleTapOn: "Save expense"
- extendedWaitUntil:
    notVisible: "Save expense"
    timeout: 10000
- runFlow: subflows/tab-accounts.yaml
# One debit only
- assertVisible: "Cash, cash, balance ₱400.00.*"
- runFlow: subflows/tab-activity.yaml
- tapOn: "Paid"
- assertVisible: "Groceries, Other, from Cash, ₱100.00.*"
