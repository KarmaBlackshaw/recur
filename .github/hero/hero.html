<!doctype html>
<!-- README hero. Edit here, then regenerate hero.png with `node .github/hero/render.mjs`. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .card {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        border: 1px solid var(--hairline);
        border-radius: 28px;
      }
      .copy {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 52px;
        width: 440px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .brand img {
        width: 64px;
        height: 64px;
        border-radius: 15px;
      }
      .brand span {
        font-family: "Oswald";
        font-weight: 500;
        font-size: 52px;
        line-height: 64px;
      }
      h1 {
        margin-top: 28px;
        font-weight: 700;
        font-size: 24px;
        line-height: 32px;
      }
      p {
        margin-top: 14px;
        font-size: 15px;
        line-height: 24px;
        color: var(--text-2);
      }
      .chips {
        display: flex;
        gap: 10px;
        margin-top: 28px;
      }
      .chip {
        padding: 7px 16px;
        border: 1px solid var(--hairline);
        border-radius: 999px;
        background: var(--surface);
        font-weight: 700;
        font-size: 14px;
        line-height: 18px;
      }
      .chip.on {
        border-color: var(--indigo);
        background: var(--indigo);
      }
      .phone {
        position: absolute;
        padding: 7px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 38px;
        background: #000;
      }
      .phone img {
        display: block;
        width: 100%;
        border-radius: 31px;
      }
      .phone.center {
        top: 56px;
        left: 650px;
        width: 224px;
      }
      .phone.left,
      .phone.right {
        top: 108px;
        width: 196px;
      }
      .phone.left {
        left: 540px;
        transform: rotate(-8deg);
      }
      .phone.right {
        left: 770px;
        transform: rotate(8deg);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="copy">
        <div class="brand">
          <img src="../../assets/icon.png" alt="" />
          <span>Recur</span>
        </div>
        <h1>See what's due, pay it in a tap, and know where your money went.</h1>
        <p>
          Bills, accounts, cards and loans in one app.<br />
          Made for the Philippines · Works offline · No account needed
        </p>
        <div class="chips">
          <span class="chip on">Android</span>
          <span class="chip">iPhone</span>
        </div>
      </div>
      <div class="phone left"><img src="../screenshots/activity.png" alt="" /></div>
      <div class="phone right"><img src="../screenshots/stats.png" alt="" /></div>
      <div class="phone center"><img src="../screenshots/home.png" alt="" /></div>
    </div>
    <script src="ready.js"></script>
  </body>
</html>
