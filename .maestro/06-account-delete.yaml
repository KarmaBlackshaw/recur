appId: com.erniejeash.recur
name: Account delete — its income leaves the Income list
---
- runFlow: subflows/launch-fresh.yaml
- runFlow: subflows/tab-accounts.yaml
- tapOn: "Add account"
- extendedWaitUntil:
    visible: "Opening balance.*"
    timeout: 5000
- tapOn:
    text: "Name"
    index: 1
- eraseText: 40
- inputText: "BPI Savings"
- hideKeyboard
- scrollUntilVisible:
    element: "Save account"
    direction: DOWN
- tapOn: "Save account"
- extendedWaitUntil:
    visible: "BPI Savings, debit.*"
    timeout: 10000
- waitForAnimationToEnd

- runFlow:
    file: subflows/add-income.yaml
    env: { AMOUNT: "2000", NOTE: "Freelance", ACCOUNT: "BPI Savings" }
- assertVisible: "1 income"
- assertVisible: "Salary, \\+₱2,000.00, BPI Savings · Freelance"

- runFlow: subflows/tab-accounts.yaml
- assertVisible: "BPI Savings, debit.*₱2,000.00.*"
- tapOn: "BPI Savings, debit.*"
- tapOn: "Edit"
- scrollUntilVisible:
    element: "Delete account"
    direction: DOWN
- tapOn: "Delete account"
- assertVisible: "Delete BPI Savings?"
- tapOn: "DELETE|Delete"
- extendedWaitUntil:
    visible: "NET WORTH"
    timeout: 10000
- assertNotVisible: "BPI Savings.*"

- runFlow: subflows/tab-activity.yaml
- tapOn: "Income"
- assertVisible: "0 incomes"
- assertNotVisible: ".*Freelance.*"
