appId: com.erniejeash.recur
name: Credit card setup — cut-off/due required, 30/31 accepted
---
- runFlow: subflows/launch-fresh.yaml
- runFlow: subflows/tab-accounts.yaml
- tapOn: "Add account"
- extendedWaitUntil:
    visible: "Opening balance.*"
    timeout: 5000
- tapOn:
    text: "Name"
    index: 1
- eraseText: 40
- inputText: "BDO Visa"
- hideKeyboard
- tapOn: "Credit card"
- scrollUntilVisible:
    element: "Due day, .*"
    direction: DOWN
# No days yet → Save disabled, and the hint names both missing days
- scrollUntilVisible:
    element: "Save account"
    direction: DOWN
- assertVisible:
    text: "Save account"
    enabled: false
- assertVisible: "Pick a cut-off day and due day to save"
# Cut-off only → still disabled
- scrollUntilVisible:
    element: "Cut-off day, .*"
    direction: UP
- tapOn: "Cut-off day, .*"
- tapOn: "The 25th"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Save account"
    direction: DOWN
- assertVisible:
    text: "Save account"
    enabled: false
- assertVisible: "Pick a due day to save"
# Days come from a 1–31 grid, so an out-of-range day can't be entered
- scrollUntilVisible:
    element: "Due day, .*"
    direction: UP
- tapOn: "Due day, .*"
- assertNotVisible: "The 32nd"
- tapOn: "The 15th"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Save account"
    direction: DOWN
- assertVisible:
    text: "Save account"
    enabled: true
- tapOn: "Save account"
- extendedWaitUntil:
    visible: "NET WORTH"
    timeout: 10000
- assertVisible: "BDO Visa, credit card.*due .* 15"
# 30 / 31 is accepted
- runFlow:
    file: subflows/add-credit-card.yaml
    env:
      NAME: "Metro Card"
      CUTOFF: "30"
      DUE: "31"
- assertVisible: "Metro Card, credit card.*due .* 31"
