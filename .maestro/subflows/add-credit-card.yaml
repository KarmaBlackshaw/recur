# env: NAME, CUTOFF, DUE (days of the month, picked from the day grid)
appId: com.erniejeash.recur
---
- runFlow: tab-accounts.yaml
- tapOn: "Add account"
- extendedWaitUntil:
    visible: "Opening balance.*"
    timeout: 5000
- tapOn:
    text: "Name"
    index: 1
- eraseText: 40
- inputText: ${NAME}
- hideKeyboard
- tapOn: "Credit card"
- scrollUntilVisible:
    element: "Due day, .*"
    direction: DOWN
- tapOn: "Cut-off day, .*"
- tapOn: "The ${CUTOFF}(st|nd|rd|th)"
- waitForAnimationToEnd
- tapOn: "Due day, .*"
- tapOn: "The ${DUE}(st|nd|rd|th)"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Save account"
    direction: DOWN
- tapOn: "Save account"
- extendedWaitUntil:
    visible: "${NAME}, credit card.*"
    timeout: 10000
- waitForAnimationToEnd
