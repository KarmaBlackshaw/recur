appId: com.erniejeash.recur
name: Home summary — left to pay, paid of total, charged to cards
# Scenario (today after the 10th):
#   BPI Gold (cut-off 1 / due 10): Netflix ₱549 one-off on the 1st → overdue bill ₱549, Netflix Charged
#   Metro Card (cut-off 30 / due 31): no charges → ₱0 bill, hidden on Home
#   Gym ₱1,000 monthly, due 28, paid from Metro Card, unpaid → in the total and left to pay
# Expected: ₱1,549.00 left to pay · ₱0.00 of ₱1,549.00 spent · ₱549.00 charged to cards
# After marking Gym paid it leaves the total as an expense, but the Metro Card Oct bill (cut-off 30)
# now carries ₱1,000: still ₱1,549.00 left to pay, ₱1,549.00 charged to cards
---
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/add-credit-card.yaml
    env: { NAME: "BPI Gold", CUTOFF: "1", DUE: "10" }
- runFlow:
    file: subflows/add-credit-card.yaml
    env: { NAME: "Metro Card", CUTOFF: "30", DUE: "31" }
- runFlow:
    file: subflows/add-one-off-expense.yaml
    env: { AMOUNT: "549", NOTE: "Netflix", ACCOUNT: "BPI Gold", BACKDATE: "true" }

# Recurring unpaid card expense
- runFlow: subflows/tab-recurring.yaml
- tapOn: "Add recurring expense"
- extendedWaitUntil:
    visible: "Add recurring bill"
    timeout: 5000
- tapOn: "Amount.*"
- inputText: "1000"
- hideKeyboard
- tapOn:
    text: "Name"
    index: 1
- inputText: "Gym"
- hideKeyboard
# A card-paid bill is due with the card bill, so it has no Due field of its own
- tapOn: "Pay from, .*"
- tapOn: "Metro Card, .*"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Save expense"
    direction: DOWN
- tapOn: "Save expense"

- runFlow: subflows/tab-home.yaml
- extendedWaitUntil:
    visible: ".*left to pay this month.*"
    timeout: 5000
- assertVisible: "₱1,549.00 left to pay this month.*"
- assertVisible: ".*₱0.00 of ₱1,549.00 spent.*"
- assertVisible: ".*₱549.00 charged to cards.*"
- assertNotVisible: "Metro Card bill.*"

# Mark the card expense paid → leaves the total as an expense, re-enters via the Metro Card bill
- runFlow: subflows/tab-recurring.yaml
- tapOn: "Mark Gym paid"
- extendedWaitUntil:
    visible: "Gym marked paid"
    timeout: 5000
- runFlow: subflows/tab-home.yaml
- extendedWaitUntil:
    visible: ".*left to pay this month.*"
    timeout: 5000
- assertVisible: "₱1,549.00 left to pay this month.*"
- assertVisible: ".*₱0.00 of ₱1,549.00 spent.*"
- assertVisible: ".*₱1,549.00 charged to cards.*"
