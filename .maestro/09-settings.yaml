appId: com.erniejeash.recur
name: Settings — notifications off/on and reminder time change without errors
---
- runFlow: subflows/launch-fresh.yaml
- tapOn: "Settings"
- scrollUntilVisible:
    element: "Reminder time, .*"
    direction: DOWN
- copyTextFrom:
    text: "\\d{1,2}:\\d{2} (AM|PM)"
    rightOf:
      text: "Reminder time"
      index: 0
- evalScript: ${output.initialTime = maestro.copiedText}
- assertTrue: ${output.initialTime.indexOf(':') > 0}

# Notifications off → on, quickly. Turning it on asks for permission when it was never asked.
# Three nodes read "Notifications" (section label, row label, Switch); only the Switch has a checked state.
- tapOn:
    text: "Notifications"
    checked: true
- assertNotVisible:
    text: "Notifications"
    checked: true
# Off, the Switch is index 1: Maestro orders matches by top edge, and the Switch is taller than its label
- tapOn:
    text: "Notifications"
    index: 1
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- assertVisible:
    text: "Notifications"
    checked: true
- assertNotVisible: "Notifications disabled.*"

# Change reminder time
- tapOn: "Reminder time, .*"
- extendedWaitUntil:
    visible: "Done"
    timeout: 5000
- swipe:
    from: "Hour,.*"
    direction: UP
- waitForAnimationToEnd
- tapOn: "Done"
- waitForAnimationToEnd
- assertNotVisible: ${output.initialTime}
- assertVisible:
    text: "\\d{1,2}:\\d{2} (AM|PM)"
    rightOf:
      text: "Reminder time"
      index: 0

# No error alert, app still alive
- assertNotVisible: ".*[Ff]ailed.*"
- assertNotVisible: ".*[Ee]rror.*"
- assertVisible: "Reminder time, .*"
